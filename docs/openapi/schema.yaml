          type: integer
        description: ID счёта.
      - in: query
        name: accountId
        schema:
          type: integer
        description: Frontend-friendly alias для account.
      - in: query
        name: amountMax
        schema:
          type: number
        description: Frontend-friendly alias для amount_max.
      - in: query
        name: amountMin
        schema:
          type: number
        description: Frontend-friendly alias для amount_min.
      - in: query
        name: amount_max
        schema:
          type: number
        description: Максимальная сумма операции.
      - in: query
        name: amount_min
        schema:
          type: number
        description: Минимальная сумма операции.
      - in: query
        name: category
        schema:
          type: integer
        description: ID категории.
      - in: query
        name: categoryId
        schema:
          type: integer
        description: Frontend-friendly alias для category.
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: Frontend-friendly alias для date_from.
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: Frontend-friendly alias для date_to.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Дата начала периода в формате YYYY-MM-DD.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Дата окончания периода в формате YYYY-MM-DD.
      - in: query
        name: kind
        schema:
          type: string
        description: 'Frontend-friendly alias для type. Допустимые значения: income,
          expense, all.'
      - in: query
        name: limit
        schema:
          type: integer
        description: Frontend-friendly alias для page_size. Если pagination-класс
          поддерживает только page_size, используйте page_size.
      - in: query
        name: onlyWithComment
        schema:
          type: boolean
        description: Frontend-friendly alias для only_with_comment.
      - in: query
        name: only_with_comment
        schema:
          type: boolean
        description: Только операции с непустым описанием. Пока отдельного поля comment
          нет, используется description.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Backend-сортировка. Поддерживаются поля: date, operation_date,
          amount, description, category, account, created_at. Можно передать несколько
          полей через запятую, например: -operation_date,amount.'
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы. По умолчанию используется первая страница.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по описанию операции, названию категории и названию счёта.
          Максимальная длина 100 символов.
      - in: query
        name: sortBy
        schema:
          type: string
        description: 'Frontend-friendly поле сортировки. Поддерживаются: date, description,
          amount, amountRub, category, account, created_at.'
      - in: query
        name: sortDir
        schema:
          type: string
        description: 'Frontend-friendly направление сортировки: asc или desc.'
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип операции: income или expense.'
      tags:
      - finance-transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
              examples:
                СписокОпераций:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 1
                        account: 1
                        account_name: Текущий
                        account_currency: RUB
                        category: 2
                        category_name: Продукты
                        category_icon: shopping-cart
                        category_color: '#10B981'
                        type: expense
                        kind: expense
                        amount: '1245.00'
                        amount_abs: '1245.00'
                        signed_amount: '-1245.00'
                        description: Покупка в супермаркете
                        operation_date: '2026-05-15'
                        date: '2026-05-15'
                        created_at: 2026-05-15T12:00:00+0300
                        updated_at: 2026-05-15T12:00:00+0300
                  summary: Список операций
          description: ''
    post:
      operationId: finance_transactions_create
      description: Создаёт финансовую операцию текущего пользователя. Счёт и категория
        должны принадлежать текущему пользователю. Тип категории должен совпадать
        с типом операции.
      summary: Создать операцию
      tags:
      - finance-transactions
