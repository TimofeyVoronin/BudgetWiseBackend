                      totalExpense: '18600.00'
                      netAmount: '-18600.00'
                      averageAmount: '1550.00'
                    categories:
                    - categoryId: 3
                      categoryName: Продукты
                      categoryIcon: cart
                      categoryColor: '#66BB6A'
                      income: '0.00'
                      expense: '15600.00'
                      netAmount: '-15600.00'
                      transactionsCount: 9
                      percent: 83.87
                    accounts:
                    - accountId: 1
                      accountName: Основная карта
                      currency: RUB
                      income: '0.00'
                      expense: '18600.00'
                      netAmount: '-18600.00'
                      transactionsCount: 12
                      percent: 100.0
                    dynamics:
                    - date: '2026-05-01'
                      income: '0.00'
                      expense: '1200.00'
                      netAmount: '-1200.00'
                      transactionsCount: 1
                    items: []
                    pagination:
                      page: 1
                      perPage: 20
                      totalItems: 12
                      totalPages: 1
                  summary: Отчёт по тегу
                ПустойОтчётПоТегу:
                  value:
                    tag:
                      id: 1
                      name: Продукты
                      groupId: 1
                      groupName: Покупки
                      color: '#66BB6A'
                      icon: cart
                      isVisible: false
                    summary:
                      transactionsCount: 0
                      totalIncome: '0.00'
                      totalExpense: '0.00'
                      netAmount: '0.00'
                      averageAmount: '0.00'
                    categories: []
                    accounts: []
                    dynamics: []
                    items: []
                    pagination:
                      page: 1
                      perPage: 20
                      totalItems: 0
                      totalPages: 1
                  summary: Пустой отчёт по тегу
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                НекорректныйФильтрОтчёта:
                  value:
                    success: false
                    error:
                      status_code: 400
                      code: validation_error
                      message: Некорректные данные запроса.
                      field_errors:
                        accounts:
                        - Некоторые счета не найдены или недоступны текущему пользователю.
                      detail: null
                      trace_id: null
                  summary: Некорректный фильтр отчёта
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
