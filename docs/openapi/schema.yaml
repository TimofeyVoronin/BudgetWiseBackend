openapi: 3.0.3
info:
  title: BudgetWiseBackend API
  version: 1.0.0
  description: OpenAPI-документация backend-части прогрессивного веб-приложения для
    управления личными финансами.
paths:
  /api/v1/:
    get:
      operationId: api_root
      summary: Корневой endpoint API версии v1
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootResponse'
              examples:
                УспешныйОтвет:
                  value:
                    service: BudgetWiseBackend API
                    version: v1
                    endpoints:
                      users: /api/v1/users/
                      finance: /api/v1/finance/
                      schema: /api/schema/
                      docs: /api/docs/
                      health: /health/
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/forgot-password/check/:
    post:
      operationId: api_v1_auth_forgot_password_check_create
      description: Принимает email и, если активный пользователь с таким email существует,
        отправляет письмо со ссылкой восстановления пароля. Ответ всегда одинаковый
        для существующего и несуществующего email.
      summary: Запросить восстановление пароля
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Если аккаунт с таким email существует, мы отправили ссылку
                      для восстановления пароля.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Аутентифицирует пользователя по email и password. При успешном
        входе возвращает access token, refresh token и краткие данные пользователя.
      summary: Войти в систему
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: admin@example.com
                  password: admin-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
              examples:
                УспешныйОтвет:
                  value:
                    access: jwt-access-token
                    refresh: jwt-refresh-token
                    user:
                      id: 1
                      username: admin
                      email: admin@example.com
                      first_name: Timofey
                      last_name: Demo
                      role: admin
                      is_active: true
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: Создаёт нового неактивного пользователя по email и password. После
        регистрации backend отправляет письмо со ссылкой подтверждения email.
      summary: Зарегистрировать пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                  password: user-password-123
                  password_confirm: user-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    username: user
                    email: user@example.com
                    is_active: false
                    detail: Пользователь зарегистрирован. Для активации аккаунта подтвердите
                      email.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: api_v1_auth_reset_password_create
      description: Принимает token восстановления пароля и новый пароль. Проверяет,
        что token существует, не истёк и не был использован. После успешной смены
        пароля token помечается использованным.
      summary: Сбросить пароль по token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: password-reset-token
                  password: NewPassword123!
                  password_confirm: NewPassword123!
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Пароль успешно изменён. Теперь можно войти с новым паролем.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: api_v1_auth_verify_email_create
      description: Проверяет token подтверждения email. Если token действителен, активирует
        аккаунт пользователя. Повторное использование token после активации запрещено.
      summary: Подтвердить email пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: email-confirmation-token
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    email: user@example.com
                    is_active: true
                    detail: Email подтверждён. Аккаунт активирован.
                  summary: Успешный ответ
          description: ''
  /api/v1/finance/categories/:
    get:
      operationId: api_v1_finance_categories_list
      summary: Получить список категорий
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Фильтр по активности категории. true - только активные, false
          - только неактивные.
      - in: query
        name: is_archived
        schema:
          type: boolean
        description: Фильтр по архивному состоянию категории. true - только архивные,
          false - только неархивные.
      - in: query
        name: is_favorite
        schema:
          type: boolean
        description: Фильтр по избранным категориям. true - только избранные, false
          - только не избранные.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка категорий. Поддерживаются поля: name, type, sort_order,
          created_at, updated_at. Для сортировки по убыванию используйте префикс ''-''.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
        description: ID родительской категории.
      - in: query
        name: root
        schema:
          type: boolean
        description: Фильтр по уровню иерархии. true - только корневые категории,
          false - только дочерние.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию категории. Максимальная длина 100 символов.
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип категории: income или expense.'
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: api_v1_finance_categories_create
      summary: Создать категорию
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/finance/categories/{id}/:
    get:
      operationId: api_v1_finance_categories_retrieve
      summary: Получить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: api_v1_finance_categories_update
      summary: Полностью обновить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: api_v1_finance_categories_partial_update
      summary: Частично обновить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: api_v1_finance_categories_destroy
      summary: Удалить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/finance/categories/{id}/archive/:
    post:
      operationId: api_v1_finance_categories_archive_create
      description: Если тело запроса пустое, категория архивируется. Для восстановления
        передайте archived=false.
      summary: Архивировать или восстановить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryArchiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryArchiveRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryArchive'
          description: ''
  /api/v1/finance/categories/{id}/favorite/:
    patch:
      operationId: api_v1_finance_categories_favorite_partial_update
      summary: Изменить признак избранной категории
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryFavoriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryFavoriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryFavoriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryFavorite'
          description: ''
  /api/v1/finance/categories/tree/:
    get:
      operationId: api_v1_finance_categories_tree_list
      summary: Получить дерево категорий
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Фильтр по активности категории. true - только активные, false
          - только неактивные.
      - in: query
        name: is_archived
        schema:
          type: boolean
        description: Фильтр по архивному состоянию категории. true - только архивные,
          false - только неархивные.
      - in: query
        name: is_favorite
        schema:
          type: boolean
        description: Фильтр по избранным категориям. true - только избранные, false
          - только не избранные.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию корневой категории. Максимальная длина 100
          символов.
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип категории: income или expense.'
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryTreeList'
          description: ''
  /api/v1/finance/transactions/:
    get:
      operationId: api_v1_finance_transactions_list
      summary: Получить список операций
      parameters:
      - in: query
        name: account
        schema:
          type: integer
      - in: query
        name: amount_max
        schema:
          type: number
        description: Максимальная сумма операции.
      - in: query
        name: amount_min
        schema:
          type: number
        description: Минимальная сумма операции.
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка. Поддерживаются поля: date, operation_date, amount,
          name, description, category, created_at. Для сортировки по убыванию используйте
          префикс ''-''. Можно передать несколько полей через запятую, например: -operation_date,amount.'
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы. По умолчанию используется первая страница.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по описанию операции. Максимальная длина 100 символов.
      - in: query
        name: type
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
    post:
      operationId: api_v1_finance_transactions_create
      summary: Создать операцию
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/finance/transactions/{id}/:
    get:
      operationId: api_v1_finance_transactions_retrieve
      summary: Получить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    patch:
      operationId: api_v1_finance_transactions_partial_update
      summary: Частично обновить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    delete:
      operationId: api_v1_finance_transactions_destroy
      summary: Удалить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/:
    get:
      operationId: api_v1_users_list
      summary: Получить список пользователей
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - in: query
        name: is_superuser
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: api_v1_users_create
      summary: Создать пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: api_v1_users_retrieve
      summary: Получить пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
