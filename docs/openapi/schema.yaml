                  is_active: true
                summary: Обновление пользователя
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_destroy
      description: Не удаляет пользователя физически, а переводит его в is_active=false.
        Администратор не может деактивировать собственную учётную запись через этот
        endpoint.
      summary: Деактивировать пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: Возвращает краткий профиль авторизованного пользователя. Endpoint
        используется фронтом для получения данных текущей сессии после входа, обновления
        страницы или проверки access token. Для полной страницы профиля используйте
        GET /api/v1/profile/me/.
      summary: Получить данные текущего пользователя
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    username: timofey
                    email: timofey@example.com
                    first_name: Timofey
                    last_name: Demo
                    middle_name: ''
                    phone: ''
                    city: ''
                    bio: ''
                    role: user
                    is_active: true
                    date_joined: 2026-05-15T12:00:00+0300
                  summary: Успешный ответ
          description: ''
    patch:
      operationId: users_me_partial_update
      description: Частично обновляет краткий профиль текущего пользователя. Для полной
        страницы профиля и camelCase-контракта используйте PUT/PATCH /api/v1/profile/me/.
      summary: Частично обновить краткие данные текущего пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
            examples:
              ОбновлениеПрофиля:
                value:
                  first_name: Timofey
                  last_name: Backend
                  middle_name: ''
                  phone: '+79990000000'
                  city: Красноярск
                  bio: Backend Python Developer
                summary: Обновление профиля
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    username: timofey
                    email: timofey@example.com
                    first_name: Timofey
                    last_name: Backend
                    middle_name: ''
                    phone: '+79990000000'
                    city: Красноярск
                    bio: Backend Python Developer
                    role: user
                    is_active: true
                    date_joined: 2026-05-15T12:00:00+0300
                  summary: Успешный ответ
          description: ''
  /health/:
    get:
      operationId: health_check
      description: Возвращает состояние backend-сервиса и базовых зависимостей. Endpoint
        доступен без авторизации и может использоваться для health-check в Docker
        Compose, мониторинге и внешних проверках.
      summary: Проверка состояния backend-сервиса и зависимостей
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                УспешныйОтвет:
                  value:
                    status: ok
                    service: BudgetWiseBackend
                    version: 1.0.0
                    timestamp: '2026-05-10T00:00:00Z'
                    checks:
                      database:
                        status: ok
                        required: true
                        latency_ms: 2.15
                        details:
                          alias: default
                          vendor: postgresql
                      redis:
                        status: ok
                        required: false
                        latency_ms: 1.25
                        details:
                          url: redis://redis:6379/0
                      celery:
                        status: ok
                        required: false
                        latency_ms: 8.42
                        details:
                          brokerUrl: redis://redis:6379/0
                          workersOnline: 1
                          workers:
                          - celery@worker
                      external_services:
                        status: skipped
                        required: false
                        latency_ms: null
                        details:
                          reason: External services are not configured yet.
                  summary: Успешный ответ
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /metrics/:
    get:
      operationId: metrics
      description: Возвращает метрики backend API в Prometheus text format. Endpoint
        защищён заголовком X-Metrics-Token. Значение токена задаётся через переменную
        окружения METRICS_ACCESS_TOKEN.
      summary: Получить Prometheus-метрики backend-сервиса
      parameters:
      - in: header
        name: X-Metrics-Token
        schema:
          type: string
        description: Token for accessing metrics endpoint.
        required: true
      tags:
      - monitoring
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
              examples:
                ФрагментУспешногоОтвета:
                  value: |
                    # HELP django_http_requests_total_by_method_total Count of requests by method.
                    # TYPE django_http_requests_total_by_method_total counter
                  summary: Фрагмент успешного ответа
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
