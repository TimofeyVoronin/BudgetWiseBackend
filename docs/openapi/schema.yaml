openapi: 3.0.3
info:
  title: BudgetWiseBackend API
  version: 1.0.0
  description: |-
    OpenAPI-документация серверной части прогрессивного веб-приложения для управления личными финансами.

    API предоставляет endpoints для регистрации и аутентификации пользователей, управления профилем, финансовыми счетами, бюджетами, тегами операций, финансовыми целями, уведомлениями, финансовыми калькуляторами, регулярными операциями, планируемыми операциями, категориями, операциями, агрегированными данными главного дашборда и служебного мониторинга.

    Авторизация защищённых endpoints выполняется через JWT Bearer token. Для ручной проверки в Swagger UI сначала выполните login-запрос, получите access token и передайте его в Authorize в формате: Bearer <access_token>.
  contact:
    name: BudgetWiseBackend
    email: noreply@budgetwise.local
  license:
    name: Educational project
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Возвращает основные группы endpoints backend API и ссылки на OpenAPI-документацию.
      summary: Корневой endpoint API версии v1
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootResponse'
              examples:
                УспешныйОтвет:
                  value:
                    service: BudgetWiseBackend API
                    version: v1
                    endpoints:
                      auth: /api/v1/auth/
                      users: /api/v1/users/
                      settings: /api/v1/settings/app/
                      finance: /api/v1/finance/
                      pwa: /api/v1/pwa/
                      schema: /api/schema/
                      docs: /api/docs/
                      redoc: /api/redoc/
                      health: /health/
                      metrics: /metrics/
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/change-email/:
    post:
      operationId: auth_change_email_create
      description: Меняет email текущего пользователя после проверки текущего пароля.
        Для действия нужен подтверждённый email или телефон. После смены email подтверждение
        сбрасывается и отправляется новое письмо.
      summary: Изменить email текущего пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            examples:
              ПримерЗапроса:
                value:
                  newEmail: new-email@example.com
                  currentPassword: Password123!
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEmail'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    email: new-email@example.com
                    isEmailVerified: false
                    emailVerificationRequired: true
                    detail: Email изменён. Подтвердите новый email по ссылке из письма.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Меняет пароль авторизованного пользователя. Для действия нужен
        подтверждённый email или телефон.
      summary: Изменить пароль текущего пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  currentPassword: OldPassword123!
                  newPassword: NewPassword123!
                  newPasswordConfirm: NewPassword123!
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Пароль успешно изменён.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/forgot-password/check/:
    post:
      operationId: auth_forgot_password_check_create
      description: Принимает email и, если активный пользователь с таким email существует,
        отправляет письмо со ссылкой восстановления пароля. Ответ всегда одинаковый
        для существующего и несуществующего email.
      summary: Запросить восстановление пароля
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Если аккаунт с таким email существует, мы отправили ссылку
                      для восстановления пароля.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Аутентифицирует пользователя по email и password. При успешном
        входе возвращает access token, refresh token и краткие данные пользователя.
      summary: Войти в систему
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: admin@example.com
                  password: admin-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
              examples:
                УспешныйОтвет:
                  value:
                    access: jwt-access-token
                    refresh: jwt-refresh-token
                    user:
                      id: 1
                      username: admin
                      email: admin@example.com
                      first_name: Timofey
                      last_name: Demo
                      role: admin
                      is_active: true
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Завершает пользовательскую сессию на сервере. Принимает refresh
        token и добавляет его в blacklist, после чего этот refresh token нельзя использовать
        для обновления access token. Access token остаётся действительным до истечения
        своего короткого срока жизни.
      summary: Выйти из системы
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              ПримерЗапроса:
                value:
                  refresh: jwt-refresh-token
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Выход выполнен. Refresh token добавлен в blacklist.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/phone/verification/confirm/:
    post:
      operationId: auth_phone_verification_confirm_create
      description: Подтверждает телефон текущего пользователя по 6-значному коду.
        После успешного подтверждения phone становится доверенным каналом для чувствительных
        действий.
      summary: Подтвердить телефон кодом
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneVerificationRequest'
            examples:
              ПримерЗапроса:
                value:
                  phone: '+79990000000'
                  code: '123456'
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPhoneVerification'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Телефон подтверждён.
                    phoneDisplay: '+79990000000'
                    isPhoneVerified: true
                    hasVerifiedContact: true
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/phone/verification/send/:
    post:
      operationId: auth_phone_verification_send_create
      description: Отправляет код подтверждения телефона текущего пользователя. Если
        телефон ещё не указан, его можно передать в запросе. Если телефон уже указан
        и меняется, нужен подтверждённый email или телефон.
      summary: Отправить код подтверждения телефона
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhoneVerificationRequest'
            examples:
              ПримерЗапроса:
                value:
                  phone: +7 (999) 000-00-00
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendPhoneVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendPhoneVerificationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPhoneVerification'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Код подтверждения телефона отправлен.
                    phoneDisplay: '+79990000000'
                    queued: true
                    isPhoneVerified: false
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Создаёт нового активного пользователя по email и password. Если
        email-верификация включена, backend отправляет письмо подтверждения, но вход
        в систему остаётся доступным сразу после регистрации.
      summary: Зарегистрировать пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                  password: user-password-123
                  password_confirm: user-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    username: user
                    email: user@example.com
                    is_active: true
                    isEmailVerified: false
                    emailVerificationRequired: true
                    detail: Пользователь зарегистрирован. Для защиты аккаунта подтвердите
                      email.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Принимает token восстановления пароля и новый пароль. Проверяет,
        что token существует, не истёк и не был использован. После успешной смены
        пароля token помечается использованным.
      summary: Сбросить пароль по token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: password-reset-token
                  password: NewPassword123!
                  password_confirm: NewPassword123!
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Пароль успешно изменён. Теперь можно войти с новым паролем.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Принимает refresh token и возвращает новую пару JWT-токенов. Используется
        клиентом для продления сессии без повторного ввода email и password.
      summary: Обновить JWT access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            examples:
              ПримерЗапроса:
                value:
                  refresh: jwt-refresh-token
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
              examples:
                УспешныйОтвет:
                  value:
                    access: new-jwt-access-token
                    refresh: rotated-jwt-refresh-token
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Проверяет token подтверждения email. Если token действителен, подтверждает
        email пользователя. Повторное использование token для уже подтверждённого
        email возвращает успешный ответ.
      summary: Подтвердить email пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: email-confirmation-token
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    email: user@example.com
                    is_active: true
                    isEmailVerified: true
                    emailVerificationRequired: false
                    detail: Email подтверждён.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      description: Отправляет новое письмо подтверждения email текущему пользователю.
        Если email уже подтверждён, возвращает успешный ответ без отправки письма.
      summary: Повторно отправить письмо подтверждения email
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendEmailVerification'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Письмо подтверждения email отправлено.
                    queued: true
                  summary: Успешный ответ
          description: ''
  /api/v1/finance/accounts/:
    get:
      operationId: finance_accounts_list
      description: Возвращает счета текущего пользователя с пагинацией, поиском и
        фильтрацией по статусу и типу. Параметр currency задаёт валюту отображения
        балансов, а accountCurrency фильтрует счета по исходной валюте счёта. Архивные
        счета не удаляются из системы и могут быть показаны через status=archived.
      summary: Получить список счетов
      parameters:
      - in: query
        name: accountCurrency
        schema:
          type: string
        description: ISO-код исходной валюты счёта для фильтрации списка, например
          RUB.
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-код валюты отображения балансов, например EUR. Не фильтрует
          список счетов.
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию счёта или банку.
      - in: query
        name: status
        schema:
          type: string
        description: 'Статус счёта: active, archived или all.'
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип счёта: card, debit, savings, cash, credit или other.'
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
              examples:
                СписокСчетов:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 1
                        name: Текущий
                        type: card
                        type_label: Банковская карта
                        typeLabel: Банковская карта
                        bank_name: Сбербанк
                        bankName: Сбербанк
                        currency: RUB
                        initial_balance: '10000.00'
                        initialBalanceRub: '10000.00'
                        balance: '45230.50'
                        balanceRub: '45230.50'
                        blocked_amount: '0.00'
                        credit_limit: '0.00'
                        available_balance: '45230.50'
                        icon: card
                        color: '#4F46E5'
                        status: active
                        is_default: true
                        isDefault: true
                        is_active: true
                        is_archived: false
                        operations_count: 3
                        operationsCount: 3
                        comment: ''
                  summary: Список счетов
          description: ''
    post:
      operationId: finance_accounts_create
      description: Создаёт счёт текущего пользователя. Текущий баланс при создании
        устанавливается равным начальному балансу. Если счёт отмечен как основной,
        остальные основные счета пользователя сбрасываются. Если currency не передан,
        используется валюта по умолчанию из настроек приложения; скрытые валюты нельзя
        выбирать для нового счёта.
      summary: Создать счёт
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            examples:
              СозданиеСчёта:
                value:
                  name: Текущий
                  type: card
                  bankName: Сбербанк
                  currency: RUB
                  initialBalanceRub: '10000.00'
                  comment: Основная карта
                  isDefault: true
                summary: Создание счёта
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/finance/accounts/{id}/:
    get:
      operationId: finance_accounts_retrieve
      description: Возвращает счёт текущего пользователя по ID вместе с количеством
        операций по этому счёту.
      summary: Получить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: finance_accounts_update
      description: Полностью обновляет данные счёта. Текущий баланс не передаётся
        напрямую через этот endpoint, так как он изменяется операциями.
      summary: Полностью обновить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: finance_accounts_partial_update
      description: Частично обновляет данные счёта. Поддерживает frontend-friendly
        поля bankName, initialBalanceRub и isDefault.
      summary: Частично обновить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
