                  value:
                    success: false
                    error:
                      status_code: 404
                      code: not_found
                      message: Объект не найден.
                      field_errors: null
                      detail: No Tag matches the given query.
                      trace_id: null
                  summary: Тег не найден или недоступен
          description: ''
