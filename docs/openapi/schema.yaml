  /api/v1/finance/transactions/:
    get:
      operationId: finance_transactions_list
      description: Возвращает операции текущего пользователя с пагинацией. Поддерживает
        backend-параметры и frontend-friendly alias-параметры для фильтров, поиска
        и сортировки, включая фильтр по тегам. Поиск выполняется по описанию операции,
        названию категории, названию счёта и тегам.
      summary: Получить список операций
      parameters:
      - in: query
        name: account
        schema:
          type: integer
        description: ID счёта.
      - in: query
        name: accountCurrency
        schema:
          type: string
        description: Фильтр по исходной валюте счёта операции, например accountCurrency=USD.
      - in: query
        name: accountId
        schema:
          type: integer
        description: Frontend-friendly alias для account.
      - in: query
        name: amountMax
        schema:
          type: number
        description: Frontend-friendly alias для amount_max.
      - in: query
        name: amountMin
        schema:
          type: number
        description: Frontend-friendly alias для amount_min.
      - in: query
        name: amount_max
        schema:
          type: number
        description: Максимальная сумма операции.
      - in: query
        name: amount_min
        schema:
          type: number
        description: Минимальная сумма операции.
      - in: query
        name: category
        schema:
          type: integer
        description: ID категории.
      - in: query
        name: categoryId
        schema:
          type: integer
        description: Frontend-friendly alias для category.
      - in: query
        name: currency
        schema:
          type: string
        description: Валюта отображения сумм в ответе. Если не передана, используется
          валюта из настроек пользователя.
      - in: query
        name: currencyCode
        schema:
          type: string
        description: Frontend-friendly alias для currency.
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: Frontend-friendly alias для date_from.
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: Frontend-friendly alias для date_to.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Дата начала периода в формате YYYY-MM-DD.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Дата окончания периода в формате YYYY-MM-DD.
      - in: query
        name: kind
        schema:
          type: string
        description: 'Frontend-friendly alias для type. Допустимые значения: income,
          expense, all.'
      - in: query
        name: limit
        schema:
          type: integer
        description: Frontend-friendly alias для page_size. Если pagination-класс
          поддерживает только page_size, используйте page_size.
      - in: query
        name: onlyWithComment
        schema:
          type: boolean
        description: Frontend-friendly alias для only_with_comment.
      - in: query
        name: only_with_comment
        schema:
          type: boolean
        description: Только операции с непустым описанием. Пока отдельного поля comment
          нет, используется description.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Backend-сортировка. Поддерживаются поля: date, operation_date,
          amount, description, category, account, created_at. Можно передать несколько
          полей через запятую, например: -operation_date,amount.'
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы. По умолчанию используется первая страница.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по описанию операции, названию категории, названию счёта
          и тегам. Максимальная длина 100 символов.
      - in: query
        name: sortBy
        schema:
          type: string
        description: 'Frontend-friendly поле сортировки. Поддерживаются: date, description,
          amount, amountRub, category, account, created_at.'
      - in: query
        name: sortDir
        schema:
          type: string
        description: 'Frontend-friendly направление сортировки: asc или desc.'
      - in: query
        name: tagIds
        schema:
          type: string
        description: Frontend-friendly alias для tags, например tagIds=1,2.
      - in: query
        name: tags
        schema:
          type: string
        description: 'Фильтр по ID тегов через запятую. Например: tags=1,2. Операция
          попадает в результат, если содержит хотя бы один из переданных тегов.'
      - in: query
        name: transactionCurrency
        schema:
          type: string
        description: Alias для accountCurrency.
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип операции: income или expense.'
      tags:
      - finance-transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
              examples:
                СписокОпераций:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 1
                        account: 1
                        account_name: Текущий
                        account_currency: RUB
                        category: 2
                        category_name: Продукты
                        category_icon: shopping-cart
                        category_color: '#10B981'
                        type: expense
                        kind: expense
                        amount: '1245.00'
                        amount_abs: '1245.00'
                        signed_amount: '-1245.00'
                        description: Покупка в супермаркете
                        operation_date: '2026-05-15'
                        date: '2026-05-15'
                        created_at: 2026-05-15T12:00:00+0300
                        updated_at: 2026-05-15T12:00:00+0300
                        tags:
                        - id: 1
                          name: Продукты
                          groupId: 1
                          groupName: Покупки
                          color: '#66BB6A'
                          icon: cart
                          isVisible: true
                  summary: Список операций
          description: ''
    post:
      operationId: finance_transactions_create
      description: Создаёт финансовую операцию текущего пользователя. Счёт и категория
        должны принадлежать текущему пользователю. Тип категории должен совпадать
        с типом операции. Теги передаются через tagIds и должны быть видимыми для
        выбора. Валюта операции определяется валютой выбранного счёта; скрытые валюты
        нельзя использовать в новых операциях.
      summary: Создать операцию
      tags:
      - finance-transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              СозданиеРасходнойОперации:
                value:
                  account: 1
                  category: 2
                  type: expense
                  amount: '1500.00'
                  description: Покупка продуктов
                  operation_date: '2026-05-15'
                  tagIds:
                  - 1
                  - 2
                  line_items:
                  - name: Молоко
                    qty: '1.000'
                    unit_price_rub: '100.00'
                    sum_rub: '100.00'
                  - name: Хлеб
                    qty: '1.000'
                    unit_price_rub: '50.00'
                    sum_rub: '50.00'
                summary: Создание расходной операции
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
