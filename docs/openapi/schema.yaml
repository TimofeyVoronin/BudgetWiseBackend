      operationId: finance_accounts_destroy
      description: Удаляет счёт только если по нему нет операций. Если операции есть,
        возвращает 409 Conflict. Для обычного скрытия счёта используйте archive endpoint.
      summary: Удалить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
