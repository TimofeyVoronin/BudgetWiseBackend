  /api/v1/finance/receipts/{receipt_id}/create-transactions/:
    post:
      operationId: finance_receipts_create_transactions_create
      description: Создаёт одну или несколько финансовых операций из импортированного
        чека. В режиме single создаётся одна операция на всю сумму чека. В режиме
        by_items создаются отдельные операции по выбранным позициям. Можно передать
        ID уже сохранённых позиций чека или ручные позиции с name/quantity/price/amount.
        После успешного создания чек получает статус imported, повторное создание
        операций запрещено.
      summary: Создать операции из чека
      parameters:
      - in: path
        name: receipt_id
        schema:
          type: integer
        required: true
      tags:
      - finance-receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptTransactionsRequest'
            examples:
              ОднаОперацияНаВесьЧек:
                value:
                  accountId: 1
                  mode: single
                  categoryId: 2
                  description: Пятёрочка · чек от 22.05.2026
                summary: Одна операция на весь чек
              ОперацииПоСохранённымПозициям:
                value:
                  accountId: 1
                  mode: by_items
                  items:
                  - receiptItemId: 10
                    categoryId: 2
                  - receiptItemId: 11
                    categoryId: 3
                summary: Операции по сохранённым позициям
              ОперацииПоРучнымПозициям:
                value:
                  accountId: 1
                  mode: by_items
                  items:
                  - name: Молоко
                    quantity: '1.000'
                    price: '90.00'
                    amount: '90.00'
                    categoryId: 2
                  - name: Хлеб
                    quantity: '1.000'
                    price: '60.00'
                    amount: '60.00'
                    categoryId: 2
                summary: Операции по ручным позициям
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateReceiptTransactionsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReceiptTransactionsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReceiptTransactionsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
