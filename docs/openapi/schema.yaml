      - amount_abs
      - category
      - category_color
      - category_icon
      - category_name
      - created_at
      - date
      - id
      - kind
      - operation_date
      - signed_amount
      - type
      - updated_at
    TransactionRequest:
      type: object
      properties:
        account:
          type: integer
          title: Счёт
        category:
          type: integer
          title: Категория
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          title: Тип операции
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Сумма
        description:
          type: string
          title: Описание
        operation_date:
          type: string
          format: date
          title: Дата операции
      required:
      - account
      - amount
      - category
      - operation_date
      - type
    TransactionTypeEnum:
      enum:
      - income
      - expense
      type: string
      description: |-
        * `income` - Доход
        * `expense` - Расход
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последний вход
      required:
      - date_joined
      - email
      - id
      - last_login
      - role
      - username
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
      required:
      - email
      - username
    VerifyEmail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        detail:
          type: string
          readOnly: true
      required:
      - detail
      - email
      - id
      - is_active
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Регистрация, вход, обновление JWT-токена, подтверждение email и восстановление
    пароля.
- name: users
  description: Endpoints профиля пользователя и административного управления пользователями.
- name: finance-accounts
  description: 'Финансовые счета: список, создание, редактирование, архивирование,
    сводка балансов, история операций по счёту и справочники для формы.'
- name: finance-goals
  description: 'Финансовые цели: список, создание, редактирование, архивирование,
    завершение, отмена, восстановление, сводка прогресса, история пополнений и справочники
    для формы.'
- name: finance-notifications
  description: 'Центр уведомлений: список, просмотр, фильтрация, отметка как прочитанное/непрочитанное,
    архивация, восстановление, сводка и справочники.'
- name: finance-categories
  description: 'Финансовые категории: список, создание, дерево категорий, избранное,
    архивирование, drag and drop порядок и подсказки категорий по описанию операции.'
- name: finance-transactions
  description: 'Финансовые операции: список, фильтрация, пагинация, создание, обновление,
    удаление и экспорт операций в CSV, XLSX и PDF.'
- name: finance-dashboard
  description: 'Главный дашборд: агрегированные показатели по счетам, доходам, расходам,
    последним операциям и категориям расходов.'
- name: health
  description: Служебные endpoints состояния backend-сервиса.
- name: monitoring
  description: Endpoints мониторинга и метрик backend-сервиса.
