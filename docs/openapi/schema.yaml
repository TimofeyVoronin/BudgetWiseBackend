          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последний вход
      required:
      - date_joined
      - email
      - id
      - last_login
      - role
      - username
    UserProfileAvatarDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Флаг успешного удаления аватара.
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: После удаления всегда null.
      required:
      - deleted
    UserProfileAvatarResponse:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Абсолютный URL нового аватара пользователя.
        message:
          type: string
          description: Короткое сообщение о результате операции.
    UserProfileAvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
          description: Файл аватара пользователя. Поддерживаются JPEG, PNG и WebP.
            Максимальный размер задаётся настройкой USER_PROFILE_AVATAR_MAX_SIZE_BYTES.
      required:
      - avatar
    UserProfileMe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        email:
          type: string
          format: email
          readOnly: true
        firstName:
          type: string
          description: Имя пользователя. Необязательное поле.
          maxLength: 150
        lastName:
          type: string
          description: Фамилия пользователя. Необязательное поле.
          maxLength: 150
        middleName:
          type: string
          description: Отчество пользователя. Необязательное поле.
          maxLength: 150
        fullName:
          type: string
          readOnly: true
          description: 'ФИО пользователя в формате: фамилия, имя, отчество.'
        phone:
          type: string
          description: Номер телефона. Поле необязательное.
          maxLength: 32
        city:
          type: string
          description: Город пользователя. Поле необязательное.
          maxLength: 120
        bio:
          type: string
          description: Краткое описание профиля. До 500 символов.
          maxLength: 500
        avatarUrl:
          type: string
          format: uri
          readOnly: true
          description: Абсолютный URL аватара пользователя или null, если аватар не
            загружен.
        isEmailVerified:
          type: boolean
          readOnly: true
          description: Статус подтверждения email. Если подтверждение email выключено,
            значение показывает, что отдельная проверка сейчас не применяется.
        isPhoneVerified:
          type: boolean
          readOnly: true
          description: Статус подтверждения телефона. Сейчас подтверждение телефона
            не подключено.
        emailVerificationEnabled:
          type: boolean
          readOnly: true
          description: Включён ли flow подтверждения email при регистрации.
        phoneVerificationEnabled:
          type: boolean
          readOnly: true
          description: Включено ли подтверждение телефона.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата регистрации пользователя.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата последнего обновления профиля. Пока отдельное поле updated_at
            не хранится, поэтому возвращается null.
      required:
      - avatarUrl
      - createdAt
      - email
      - emailVerificationEnabled
      - fullName
      - id
      - isEmailVerified
      - isPhoneVerified
      - phoneVerificationEnabled
      - updatedAt
      - username
    UserProfileMeRequest:
      type: object
      properties:
        firstName:
          type: string
          description: Имя пользователя. Необязательное поле.
          maxLength: 150
        lastName:
          type: string
          description: Фамилия пользователя. Необязательное поле.
          maxLength: 150
        middleName:
          type: string
          description: Отчество пользователя. Необязательное поле.
          maxLength: 150
        phone:
          type: string
          description: Номер телефона. Поле необязательное.
          maxLength: 32
        city:
          type: string
          description: Город пользователя. Поле необязательное.
          maxLength: 120
        bio:
          type: string
          description: Краткое описание профиля. До 500 символов.
          maxLength: 500
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
      required:
      - email
      - username
    ValidateBudgetFormRequest:
      type: object
      properties:
        categoryName:
          type: string
          maxLength: 100
        categoryId:
          type: integer
        limitRub:
          type: number
          format: double
          maximum: 1000000000000
          minimum: 0.01
          exclusiveMaximum: true
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
      required:
      - limitRub
      - periodEnd
      - periodStart
    ValidateBudgetFormResponse:
      type: object
      properties:
        ok:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - fieldErrors
      - ok
    ValidateBudgetNotificationThresholdsRequest:
      type: object
      properties:
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/BudgetNotificationThresholdUpdateItemRequest'
      required:
      - thresholds
    ValidateBudgetNotificationThresholdsResponse:
      type: object
      properties:
        ok:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        generalMessage:
          type: string
          nullable: true
      required:
      - ok
    ValidateCustomCurrencyRequest:
      type: object
      properties:
        code:
          type: string
          description: Код проверяемой валюты.
          maxLength: 3
        name:
          type: string
          description: Название проверяемой валюты.
          maxLength: 100
        symbol:
          type: string
          description: Символ проверяемой валюты.
          maxLength: 12
        excludeId:
          type: integer
          nullable: true
          description: ID валюты, которую нужно исключить при проверке дубля.
    ValidateCustomCurrencyResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Форма прошла проверку.
        fieldErrors:
          allOf:
          - $ref: '#/components/schemas/CurrencyFormValidationErrors'
          description: Ошибки по полям формы.
      required:
      - fieldErrors
      - ok
    ValidatePlannedFormRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        kind:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amountAbs:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        plannedDate:
          type: string
          format: date
        allowPastDate:
          type: boolean
          default: false
      required:
      - amountAbs
      - kind
      - name
      - plannedDate
    ValidateRecurringScheduleRequest:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        hasEnd:
          type: boolean
          default: false
        frequency:
          $ref: '#/components/schemas/RecurringFrequencyEnum'
        dayOfMonth:
          type: integer
          maximum: 31
          minimum: 1
          nullable: true
      required:
      - frequency
      - startDate
    ValidateTagRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        groupId:
          type: integer
          nullable: true
        color:
          type: string
          minLength: 1
          default: '#4F46E5'
          maxLength: 7
        icon:
          type: string
          minLength: 1
          default: tag
          maxLength: 50
        excludeId:
          type: integer
          nullable: true
        description:
          type: string
          maxLength: 500
      required:
      - name
    ValidateTagResponse:
      type: object
      properties:
        ok:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - fieldErrors
      - ok
    VerifyEmail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        detail:
          type: string
          readOnly: true
      required:
      - detail
      - email
      - id
      - is_active
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Регистрация, вход, обновление JWT-токена, подтверждение email и восстановление
    пароля.
- name: users
  description: Endpoints профиля пользователя и административного управления пользователями.
- name: users-profile
  description: 'Страница профиля текущего пользователя: получение и обновление ФИО,
    телефона, города, краткого описания и статусов подтверждения контактных данных.'
- name: finance-accounts
  description: 'Финансовые счета: список, создание, редактирование, архивирование,
    сводка балансов, история операций по счёту и справочники для формы.'
- name: finance-budgets
  description: 'Бюджеты и лимиты: список, создание, редактирование, удаление, пауза,
    возобновление, расчёт прогресса, предупреждения, детальная статистика и справочники
    для формы.'
- name: finance-goals
  description: 'Финансовые цели: список, создание, редактирование, архивирование,
    завершение, отмена, восстановление, сводка прогресса, история пополнений и справочники
    для формы.'
- name: finance-notifications
  description: 'Центр уведомлений: список, просмотр, фильтрация, отметка как прочитанное/непрочитанное,
    архивация, восстановление, сводка, справочники, настройки каналов, типов уведомлений
    и тихих часов.'
- name: finance-budget-notifications
  description: 'Настройки уведомлений о бюджетах и целях: включение, пороги, типы
    событий, каналы доставки, защита от дублей, предпросмотр и тестовая отправка.
    На текущем этапе реально доступен in-app канал.'
- name: finance-currencies
  description: 'Управление валютами пользователя: список доступных валют, каталог
    системных валют, пользовательские валюты, основная валюта, видимость в интерфейсе
    и select-options для финансовых форм.'
- name: finance-calculators
  description: 'Финансовые калькуляторы без сохранения результата в базе: кредит,
    ипотека, рассрочка, вклад, пенсионные накопления и инфляция. Endpoints возвращают
    значения по умолчанию, выполняют расчёт и показывают ошибки валидации входных
    параметров.'
- name: finance-recurring-transactions
  description: 'Регулярные операции: список, создание, редактирование, удаление, пауза,
    возобновление, завершение, справочники, сводка, история списаний и проверка расписания.'
- name: finance-planned-transactions
  description: 'Планируемые операции: будущие доходы и расходы, список, создание,
    редактирование, отмена, подтверждение, конвертация в фактические операции, календарь
    и прогноз баланса.'
- name: finance-categories
  description: 'Финансовые категории: список, создание, дерево категорий, избранное,
    архивирование, drag and drop порядок и подсказки категорий по описанию операции.'
- name: finance-tags
  description: 'Теги операций: централизованное управление тегами, группы, поиск,
    создание, редактирование, удаление, видимость в формах и справочники для выбора
    тегов в операциях и отчётах.'
- name: finance-transaction-templates
  description: 'Шаблоны операций: сохранённые заготовки доходов и расходов, создание,
    редактирование, архивирование, дублирование, черновик применения и создание операции
    из шаблона.'
- name: finance-transactions
  description: 'Финансовые операции: список, фильтрация, пагинация, создание, обновление,
    удаление и экспорт операций в CSV, XLSX и PDF.'
- name: finance-receipts
  description: 'Фискальные чеки: импорт данных из QR-кода, защита от дублей, сопоставление
    позиций с категориями и создание одной или нескольких финансовых операций из исходного
    чека.'
- name: finance-dashboard
  description: 'Главный дашборд: агрегированные показатели по счетам, доходам, расходам,
    последним операциям и категориям расходов.'
- name: finance-sync
  description: 'Оффлайн-синхронизация: доменные области offline-first, meta-параметры,
    начальный снимок данных, получение изменений после последней синхронизации и batch-отправка
    оффлайн-операций с идемпотентностью по clientMutationId.'
- name: finance-calendar
  description: 'Финансовый календарь: месячная сетка, события доходов и расходов,
    плановые операции, дневные балансы, прогноз остатка, риски кассового разрыва и
    справочники фильтров.'
- name: pwa
  description: 'PWA-инфраструктура: регистрация push-подписок браузера, хранение ключей
    подписки, настройки push-уведомлений и параметры background sync для Service Worker.'
- name: app-settings
  description: 'Настройки приложения текущего пользователя: часовой пояс, формат даты,
    формат чисел, валюта по умолчанию, справочники для формы и сброс к значениям по
    умолчанию.'
- name: health
  description: Служебные endpoints состояния backend-сервиса.
- name: monitoring
  description: Endpoints мониторинга и метрик backend-сервиса.
