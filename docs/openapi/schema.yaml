        синхронизации. Endpoint используется фронтом для модального окна конфликта
        и документации поведения: server_wins, client_wins, merge, last_write_wins
        и manual_confirmation как политика по умолчанию.'
      summary: Получить стратегии разрешения конфликтов
      tags:
      - finance-sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConflictMeta'
              examples:
                СтратегииКонфликтов:
                  value:
                    schemaVersion: 1
                    serverTime: 2026-05-24T21:40:00+0300
                    defaultPolicy: manual_confirmation
                    recommendedManualStrategy: merge
                    strategies:
                    - value: server_wins
                      label: Серверная версия
                      requiresPayload: false
                      automatic: true
                    - value: last_write_wins
                      label: Последняя запись побеждает
                      requiresPayload: false
                      automatic: true
                  summary: Стратегии конфликтов
          description: ''
  /api/v1/finance/sync/conflicts/resolve/:
    post:
      operationId: finance_sync_conflict_resolve_create
      description: Применяет выбранную стратегию разрешения конфликта для серверной
        записи. server_wins оставляет серверную версию без изменений, client_wins
        применяет клиентский payload, merge применяет вручную собранный payload после
        выбора полей на фронте, last_write_wins выбирает более позднюю версию по clientUpdatedAt
        и serverVersion.
      summary: Разрешить конфликт оффлайн-синхронизации
      tags:
      - finance-sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncConflictResolveRequestRequest'
            examples:
              РучнойMergeОперации:
                value:
                  resource: transactions
                  serverId: 12
                  strategy: merge
                  payload:
                    description: Итоговое описание после ручного merge
                    amount: '120.00'
                summary: Ручной merge операции
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncConflictResolveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncConflictResolveRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConflictResolveResponse'
              examples:
                Ответ:
                  value:
                    status: resolved
                    resource: transactions
                    serverId: 12
                    strategy: merge
                    version: 2026-05-24T13:45:00+0300
                    data:
                      id: 12
                      description: Итоговое описание после ручного merge
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
