        schema:
          type: string
        description: Alias для accounts.
      - in: query
        name: accounts
        schema:
          type: string
        description: ID счетов через запятую, например accounts=1,2.
      - in: query
        name: categories
        schema:
          type: string
        description: ID категорий через запятую, например categories=3,4.
      - in: query
        name: categoryIds
        schema:
          type: string
        description: Alias для categories.
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: Дата начала периода в формате YYYY-MM-DD.
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: Дата окончания периода в формате YYYY-MM-DD.
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: kind
        schema:
          type: string
        description: 'Alias для type: income, expense или all.'
      - in: query
        name: limit
        schema:
          type: integer
        description: Frontend alias для perPage.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: date, -date, amount, -amount, category, account,
          createdAt.'
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы. По умолчанию 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Backend alias для perPage.
      - in: query
        name: perPage
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по описанию операции, категории, счёту и тегам.
      - in: query
