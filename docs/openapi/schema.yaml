openapi: 3.0.3
info:
  title: BudgetWiseBackend API
  version: 1.0.0
  description: OpenAPI-документация backend-части прогрессивного веб-приложения для
    управления личными финансами.
paths:
  /api/v1/:
    get:
      operationId: api_root
      summary: Корневой endpoint API версии v1
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootResponse'
              examples:
                УспешныйОтвет:
                  value:
                    service: BudgetWiseBackend API
                    version: v1
                    endpoints:
                      users: /api/v1/users/
                      finance: /api/v1/finance/
                      schema: /api/schema/
                      docs: /api/docs/
                      health: /health/
                  summary: Успешный ответ
          description: ''
  /api/v1/finance/categories/:
    get:
      operationId: api_v1_finance_categories_list
      summary: Получить список категорий
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: api_v1_finance_categories_create
      summary: Создать категорию
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/finance/categories/{id}/:
    get:
      operationId: api_v1_finance_categories_retrieve
      summary: Получить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: api_v1_finance_categories_partial_update
      summary: Частично обновить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: api_v1_finance_categories_destroy
      summary: Удалить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/finance/categories/tree/:
    get:
      operationId: api_v1_finance_categories_tree_list
      summary: Получить дерево категорий
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryTreeList'
          description: ''
  /api/v1/finance/transactions/:
    get:
      operationId: api_v1_finance_transactions_list
      summary: Получить список операций
      parameters:
      - in: query
        name: account
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
    post:
      operationId: api_v1_finance_transactions_create
      summary: Создать операцию
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/finance/transactions/{id}/:
    get:
      operationId: api_v1_finance_transactions_retrieve
      summary: Получить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    patch:
      operationId: api_v1_finance_transactions_partial_update
      summary: Частично обновить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    delete:
      operationId: api_v1_finance_transactions_destroy
      summary: Удалить операцию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Операция.
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/:
    get:
      operationId: api_v1_users_list
      summary: Получить список пользователей
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - in: query
        name: is_superuser
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: api_v1_users_create
      summary: Создать пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: api_v1_users_retrieve
      summary: Получить пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_users_partial_update
      summary: Частично обновить пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: api_v1_users_destroy
      summary: Деактивировать пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      summary: Получить данные текущего пользователя
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: users_me_partial_update
      summary: Частично обновить данные текущего пользователя
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /health/:
    get:
      operationId: health_check
      summary: Проверка состояния backend-сервиса
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                УспешныйОтвет:
                  value:
                    status: ok
                    service: BudgetWiseBackend
                    version: 1.0.0
                    timestamp: '2026-05-09T00:00:00+00:00'
                  summary: Успешный ответ
          description: ''
components:
  schemas:
    APIRootResponse:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
      required:
      - endpoints
      - service
      - version
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
          title: Родительская категория
        name:
          type: string
          title: Название категории
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип категории
        is_active:
          type: boolean
          title: Активна
        children_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - children_count
      - created_at
      - id
      - name
      - type
      - updated_at
    CategoryRequest:
      type: object
      properties:
        parent:
          type: integer
          nullable: true
          title: Родительская категория
        name:
          type: string
          minLength: 1
          title: Название категории
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип категории
        is_active:
          type: boolean
          title: Активна
      required:
      - name
      - type
    CategoryTree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
          title: Родительская категория
        name:
          type: string
          title: Название категории
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип категории
        is_active:
          type: boolean
          title: Активна
        children:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - children
      - created_at
      - id
      - name
      - type
      - updated_at
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
      required:
      - date_joined
      - email
      - id
      - is_active
      - role
      - username
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - service
      - status
      - timestamp
      - version
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCategoryTreeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTree'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedCategoryRequest:
      type: object
      properties:
        parent:
          type: integer
          nullable: true
          title: Родительская категория
        name:
          type: string
          minLength: 1
          title: Название категории
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип категории
        is_active:
          type: boolean
          title: Активна
    PatchedCurrentUserRequest:
      type: object
      properties:
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
    PatchedTransactionRequest:
      type: object
      properties:
        account:
          type: integer
          title: Счёт
        category:
          type: integer
          title: Категория
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип операции
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Сумма
        description:
          type: string
          title: Описание
        operation_date:
          type: string
          format: date
          title: Дата операции
    PatchedUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
          title: Счёт
        category:
          type: integer
          title: Категория
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип операции
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Сумма
        description:
          type: string
          title: Описание
        operation_date:
          type: string
          format: date
          title: Дата операции
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - account
      - amount
      - category
      - created_at
      - id
      - operation_date
      - type
      - updated_at
    TransactionRequest:
      type: object
      properties:
        account:
          type: integer
          title: Счёт
        category:
          type: integer
          title: Категория
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип операции
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Сумма
        description:
          type: string
          title: Описание
        operation_date:
          type: string
          format: date
          title: Дата операции
      required:
      - account
      - amount
      - category
      - operation_date
      - type
    TypeEnum:
      enum:
      - income
      - expense
      type: string
      description: |-
        * `income` - Доход
        * `expense` - Расход
    User:
      type: object
      properties:
        id:
