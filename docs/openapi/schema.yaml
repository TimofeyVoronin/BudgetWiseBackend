  /health/:
    get:
      operationId: health_check
      summary: Проверка состояния backend-сервиса и зависимостей
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                УспешныйОтвет:
                  value:
                    status: ok
                    service: BudgetWiseBackend
                    version: 1.0.0
                    timestamp: '2026-05-10T00:00:00Z'
                    checks:
                      database:
                        status: ok
                        required: true
                        latency_ms: 2.15
                        details:
                          alias: default
                          vendor: postgresql
                      redis:
                        status: skipped
                        required: false
                        latency_ms: null
                        details:
                          reason: Redis is not configured yet.
                      celery:
                        status: skipped
                        required: false
                        latency_ms: null
                        details:
                          reason: Celery health-check is not configured yet.
                      external_services:
                        status: skipped
                        required: false
                        latency_ms: null
                        details:
                          reason: External services are not configured yet.
                  summary: Успешный ответ
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /metrics/:
    get:
      operationId: metrics
      description: Возвращает метрики backend API в Prometheus text format. Endpoint
        защищён заголовком X-Metrics-Token.
      summary: Prometheus-compatible metrics endpoint
      parameters:
      - in: header
        name: X-Metrics-Token
        schema:
          type: string
        description: Token for accessing metrics endpoint.
        required: true
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
