  /api/v1/finance/budget-notifications/check/:
    post:
      operationId: finance_budget_notifications_check_create
      description: Запускает сервис формирования событий бюджетных уведомлений для
        текущего пользователя. Сервис учитывает настройки, активные пороги, типы событий,
        выбранные цели и защиту от дублей. При dryRun=true события не сохраняются,
        а только возвращаются в ответе для предпросмотра. При dryRun=false новые события
        передаются в централизованный Notification Center через in-app канал. Email
        и push логируются как skipped, потому что провайдеры пока не подключены.
      summary: Запустить проверку бюджетных уведомлений
      tags:
      - finance-budget-notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetNotificationCheckRequest'
            examples:
              РучнаяПроверкаБезСохранения:
                value:
                  date: '2026-05-21'
                  dryRun: true
                summary: Ручная проверка без сохранения
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BudgetNotificationCheckRequest'
          multipart/form-data:
            schema:
