openapi: 3.0.3
info:
  title: BudgetWiseBackend API
  version: 1.0.0
  description: |-
    OpenAPI-документация серверной части прогрессивного веб-приложения для управления личными финансами.

    API предоставляет endpoints для регистрации и аутентификации пользователей, управления профилем, финансовыми счетами, финансовыми целями, уведомлениями, категориями, операциями, агрегированными данными главного дашборда и служебного мониторинга.

    Авторизация защищённых endpoints выполняется через JWT Bearer token. Для ручной проверки в Swagger UI сначала выполните login-запрос, получите access token и передайте его в Authorize в формате: Bearer <access_token>.
  contact:
    name: BudgetWiseBackend
    email: noreply@budgetwise.local
  license:
    name: Educational project
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Возвращает основные группы endpoints backend API и ссылки на OpenAPI-документацию.
      summary: Корневой endpoint API версии v1
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootResponse'
              examples:
                УспешныйОтвет:
                  value:
                    service: BudgetWiseBackend API
                    version: v1
                    endpoints:
                      auth: /api/v1/auth/
                      users: /api/v1/users/
                      finance: /api/v1/finance/
                      schema: /api/schema/
                      docs: /api/docs/
                      redoc: /api/redoc/
                      health: /health/
                      metrics: /metrics/
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/forgot-password/check/:
    post:
      operationId: auth_forgot_password_check_create
      description: Принимает email и, если активный пользователь с таким email существует,
        отправляет письмо со ссылкой восстановления пароля. Ответ всегда одинаковый
        для существующего и несуществующего email.
      summary: Запросить восстановление пароля
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Если аккаунт с таким email существует, мы отправили ссылку
                      для восстановления пароля.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Аутентифицирует пользователя по email и password. При успешном
        входе возвращает access token, refresh token и краткие данные пользователя.
      summary: Войти в систему
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: admin@example.com
                  password: admin-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
              examples:
                УспешныйОтвет:
                  value:
                    access: jwt-access-token
                    refresh: jwt-refresh-token
                    user:
                      id: 1
                      username: admin
                      email: admin@example.com
                      first_name: Timofey
                      last_name: Demo
                      role: admin
                      is_active: true
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Создаёт нового неактивного пользователя по email и password. После
        регистрации backend отправляет письмо со ссылкой подтверждения email.
      summary: Зарегистрировать пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              ПримерЗапроса:
                value:
                  email: user@example.com
                  password: user-password-123
                  password_confirm: user-password-123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    username: user
                    email: user@example.com
                    is_active: false
                    detail: Пользователь зарегистрирован. Для активации аккаунта подтвердите
                      email.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Принимает token восстановления пароля и новый пароль. Проверяет,
        что token существует, не истёк и не был использован. После успешной смены
        пароля token помечается использованным.
      summary: Сбросить пароль по token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: password-reset-token
                  password: NewPassword123!
                  password_confirm: NewPassword123!
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword'
              examples:
                УспешныйОтвет:
                  value:
                    detail: Пароль успешно изменён. Теперь можно войти с новым паролем.
                  summary: Успешный ответ
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Проверяет token подтверждения email. Если token действителен, активирует
        аккаунт пользователя. Повторное использование token после активации запрещено.
      summary: Подтвердить email пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            examples:
              ПримерЗапроса:
                value:
                  token: email-confirmation-token
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    email: user@example.com
                    is_active: true
                    detail: Email подтверждён. Аккаунт активирован.
                  summary: Успешный ответ
          description: ''
  /api/v1/finance/accounts/:
    get:
      operationId: finance_accounts_list
      description: Возвращает счета текущего пользователя с пагинацией, поиском и
        фильтрацией по статусу, типу и валюте. Архивные счета не удаляются из системы
        и могут быть показаны через status=archived.
      summary: Получить список счетов
      parameters:
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-код валюты, например RUB.
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию счёта или банку.
      - in: query
        name: status
        schema:
          type: string
        description: 'Статус счёта: active, archived или all.'
      - in: query
        name: type
        schema:
          type: string
        description: 'Тип счёта: card, debit, savings, cash, credit или other.'
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
              examples:
                СписокСчетов:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 1
                        name: Текущий
                        type: card
                        type_label: Банковская карта
                        typeLabel: Банковская карта
                        bank_name: Сбербанк
                        bankName: Сбербанк
                        currency: RUB
                        initial_balance: '10000.00'
                        initialBalanceRub: '10000.00'
                        balance: '45230.50'
                        balanceRub: '45230.50'
                        blocked_amount: '0.00'
                        credit_limit: '0.00'
                        available_balance: '45230.50'
                        icon: card
                        color: '#4F46E5'
                        status: active
                        is_default: true
                        isDefault: true
                        is_active: true
                        is_archived: false
                        operations_count: 3
                        operationsCount: 3
                        comment: ''
                  summary: Список счетов
          description: ''
    post:
      operationId: finance_accounts_create
      description: Создаёт счёт текущего пользователя. Текущий баланс при создании
        устанавливается равным начальному балансу. Если счёт отмечен как основной,
        остальные основные счета пользователя сбрасываются.
      summary: Создать счёт
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            examples:
              СозданиеСчёта:
                value:
                  name: Текущий
                  type: card
                  bankName: Сбербанк
                  currency: RUB
                  initialBalanceRub: '10000.00'
                  comment: Основная карта
                  isDefault: true
                summary: Создание счёта
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/finance/accounts/{id}/:
    get:
      operationId: finance_accounts_retrieve
      description: Возвращает счёт текущего пользователя по ID вместе с количеством
        операций по этому счёту.
      summary: Получить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: finance_accounts_update
      description: Полностью обновляет данные счёта. Текущий баланс не передаётся
        напрямую через этот endpoint, так как он изменяется операциями.
      summary: Полностью обновить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: finance_accounts_partial_update
      description: Частично обновляет данные счёта. Поддерживает frontend-friendly
        поля bankName, initialBalanceRub и isDefault.
      summary: Частично обновить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    delete:
      operationId: finance_accounts_destroy
      description: Удаляет счёт только если по нему нет операций. Если операции есть,
        возвращает 409 Conflict. Для обычного скрытия счёта используйте archive endpoint.
      summary: Удалить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/finance/accounts/{id}/archive/:
    patch:
      operationId: finance_accounts_archive_partial_update
      description: Переводит счёт в архив или восстанавливает его. Архивный счёт не
        участвует в общем балансе и скрывается из списка активных счетов, но история
        операций по нему сохраняется.
      summary: Архивировать или восстановить счёт
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - finance-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountArchiveRequest'
            examples:
              ОтправитьСчётВАрхив:
                value:
                  archived: true
                summary: Отправить счёт в архив
              ВосстановитьСчёт:
                value:
                  archived: false
                summary: Восстановить счёт
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountArchiveRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/finance/accounts/{id}/history/:
    get:
      operationId: finance_accounts_history_list
      description: Возвращает последние операции текущего пользователя по выбранному
        счёту. Используется в карточке детального просмотра счёта.
      summary: Получить историю операций по счёту
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы. По умолчанию 20, максимум 100.
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountHistoryRowList'
          description: ''
  /api/v1/finance/accounts/meta/:
    get:
      operationId: finance_accounts_meta_retrieve
      description: Возвращает типы счетов, популярные банки и валюты для формы создания
        или редактирования счёта.
      summary: Получить справочники для формы счёта
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMeta'
              examples:
                СправочникиСчетов:
                  value:
                    types:
                    - title: Банковская карта
                      value: card
                      icon: card
                    - title: Дебетовая карта
                      value: debit
                      icon: card
                    - title: Накопительный
                      value: savings
                      icon: bank
                    - title: Наличные
                      value: cash
                      icon: cash
                    - title: Кредитный
                      value: credit
                      icon: credit-card
                    - title: Другое
                      value: other
                      icon: wallet
                    banks:
                    - title: Сбербанк
                      value: Сбербанк
                    - title: Тинькофф
                      value: Тинькофф
                    - title: ВТБ
                      value: ВТБ
                    - title: Альфа-Банк
                      value: Альфа-Банк
                    - title: Газпромбанк
                      value: Газпромбанк
                    - title: Другой банк
                      value: other
                    currencies:
                    - title: RUB ₽
                      value: RUB
                    - title: USD $
                      value: USD
                    - title: EUR €
                      value: EUR
                  summary: Справочники счетов
          description: ''
  /api/v1/finance/accounts/summary/:
    get:
      operationId: finance_accounts_summary_retrieve
      description: Возвращает общий баланс активных неархивных счетов текущего пользователя,
        количество активных счетов и количество счетов в архиве. По умолчанию используется
        валюта RUB.
      summary: Получить сводку по счетам
      parameters:
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-код валюты, например RUB. По умолчанию RUB.
      tags:
      - finance-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              examples:
                СводкаПоСчетам:
                  value:
                    total_balance: '127450.50'
                    totalBalanceRub: '127450.50'
                    active_count: 4
                    archived_count: 1
                    currency: RUB
                  summary: Сводка по счетам
          description: ''
  /api/v1/finance/categories/:
    get:
      operationId: finance_categories_list
      description: Возвращает категории текущего пользователя с пагинацией. Поддерживает
        фильтрацию по типу, родителю, активности, архиву, избранному и поиску по названию.
        Используется для таблиц, списков и форм выбора категории на фронте.
      summary: Получить список категорий
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Фильтр по активности категории. true - только активные, false
          - только неактивные.
      - in: query
        name: is_archived
        schema:
          type: boolean
        description: Фильтр по архивному состоянию категории. true - только архивные,
          false - только неархивные.
      - in: query
        name: is_favorite
        schema:
          type: boolean
        description: Фильтр по избранным категориям. true - только избранные, false
          - только не избранные.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка категорий. Поддерживаются поля: name, type, sort_order,
          created_at, updated_at. Для сортировки по убыванию используйте префикс ''-''.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
        description: ID родительской категории.
      - in: query
        name: root
        schema:
          type: boolean
        description: Фильтр по уровню иерархии. true - только корневые категории,
          false - только дочерние.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию категории. Максимальная длина 100 символов.
      - in: query
        name: type
        schema:
          type: string
