                      income: '50000.00'
                      expense: '12450.00'
                      net: '37550.00'
                    recent_transactions:
                    - id: 1
                      account: 1
                      account_name: Основная карта
                      account_currency: RUB
                      category: 2
                      category_name: Продукты
                      category_icon: shopping-cart
                      category_color: '#10B981'
                      type: expense
                      kind: expense
                      amount: '1245.00'
                      amount_abs: '1245.00'
