  /api/v1/finance/dashboard/summary/:
    get:
      operationId: finance_dashboard_summary_retrieve
      description: 'Возвращает основные агрегаты для главной страницы: общий баланс
        активных счетов, сумму доходов и расходов за текущий месяц, чистый результат,
        последние операции и топ категорий расходов. Блок reminders зарезервирован
        для будущего эпика напоминаний и пока возвращается с пустым списком rows.
        Можно ограничить расчёты конкретными тегами через tags/tagIds. Результат кэшируется
        на короткое время по пользователю, периоду, диапазону дат, валюте, limit и
        набору тегов.'
      summary: Получить агрегированные данные главного дашборда
      parameters:
      - in: query
        name: currency
        schema:
          type: string
        description: ISO-код валюты отображения. Если параметр не передан, используется
          валюта по умолчанию из настроек приложения. Суммы пересчитываются backend-ом
          по актуальным курсам.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Дата начала периода. Обязательна для period=custom.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Дата окончания периода. Обязательна для period=custom.
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество последних операций в блоке recent_transactions. По
          умолчанию 5, максимум 20.
      - in: query
        name: period
        schema:
          type: string
        description: 'Период dashboard: week, month, year или custom. По умолчанию
          month.'
      - in: query
        name: tagIds
        schema:
          type: string
        description: Frontend-friendly alias для tags, например tagIds=1,2.
      - in: query
        name: tags
        schema:
          type: string
        description: 'ID тегов через запятую для фильтрации доходов, расходов, последних
          операций и топа категорий. Например: tags=1,2.'
      tags:
      - finance-dashboard
      security:
      - jwtAuth: []
