global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "budgetwise-backend"
    metrics_path: "/metrics/"
    scheme: "http"
    static_configs:
      - targets:
          - "backend:8000"
    http_headers:
      X-Metrics-Token:
        values:
          - "budgetwise-metrics-dev-token"