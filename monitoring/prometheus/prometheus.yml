global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "budgetwise-backend"
    metrics_path: "/metrics/"
    scheme: "http"
    static_configs:
      - targets:
          - "backend:8000"
    http_headers:
      X-Metrics-Token:
        values:
          - "budgetwise-metrics-dev-token"